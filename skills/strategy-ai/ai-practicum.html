  <script>
    const data=JSON.parse(document.getElementById('practicum-data').textContent);const state={strategyStage:'overview',scenario:'base',option:data.strategy.selectedInitiativeId};

    const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function renderStages(){const stages=stageMap;document.getElementById('stages').innerHTML=stages.map((s,i)=>`<button class="stage ${state.strategyStage===s[0]?'active':''}" data-stage="${s[0]}"><span class="stage-index">${String(i+1).padStart(2,'0')}</span>${esc(s[1])}</button>`).join('')}
    function lineChart(points,color='#15827b'){const w=760,h=270,p=34,vals=points.map(x=>Number(x.value)),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1;const xy=points.map((d,i)=>({x:p+i*((w-p*2)/Math.max(1,points.length-1)),y:h-p-((d.value-min)/span)*(h-p*2),...d}));const path=xy.map((d,i)=>(i?'L':'M')+d.x+' '+d.y).join(' ');return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="График"><g stroke="#dce2e7">${[0,1,2,3].map(i=>`<line x1="${p}" x2="${w-p}" y1="${p+i*(h-p*2)/3}" y2="${p+i*(h-p*2)/3}"/>`).join('')}</g><path d="${path}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${xy.map(d=>`<circle cx="${d.x}" cy="${d.y}" r="6" fill="${color}"/><text x="${d.x}" y="${d.y-14}" text-anchor="middle" fill="#19253b" font-size="13" font-weight="700">${esc(d.value)}</text><text x="${d.x}" y="${h-7}" text-anchor="middle" fill="#68758d" font-size="12">${esc(d.date)}</text>`).join('')}</svg>`}
    function strategy(){const s=data.strategy,stage=state.strategyStage;if(stage==='overview')return head('Strategy AI','Текущая позиция '+s.company.name,s.company.description)+`<div class="grid metrics">${s.company.metrics.map(m=>`<article class="card"><div class="metric-value">${esc(m.value)}</div><div class="metric-label">${esc(m.label)}</div></article>`).join('')}</div><section class="section"><h2>Выбранное направление</h2><article class="card"><div class="kicker">Стратегическая теза</div><h2>${esc(s.initiatives.find(x=>x.id===s.selectedInitiativeId)?.name)}</h2><p class="subtitle">${esc(s.plan.thesis)}</p></article></section>`;

    function render(){document.getElementById('updated').textContent='Обновлено: '+data.meta.updatedAt;renderStages();document.getElementById('content').innerHTML=strategy();window.scrollTo({top:0,behavior:'smooth'})}
    document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){state.strategyStage=stage.dataset.stage;render();return}const option=e.target.closest('[data-option]');if(option){state.option=option.dataset.option;render();return}const scenario=e.target.closest('[data-scenario]');if(scenario){state.scenario=scenario.dataset.scenario;render()}});render();
